[package]
name = "bwdashboard"
version = "0.1.0"
edition = "2024"
authors = ["Ersit <229477727+Ersites@users.noreply.github.com>"]
description = "Dashboard for Bed Wars"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ersites/bwdashboard"
readme = "README.md"

[dependencies]
crossbeam = "0.8.5"
eframe = "0.36.2"
env_logger = "0.11.11"
log = "0.4.34"
reqwest = {version = "0.13.5", features = ["json"]}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
